<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="blobA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6f7ae8" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#5661c9" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#4a55bb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E36E91" stop-opacity="0.50"/>
      <stop offset="55%" stop-color="#E36E91" stop-opacity="0.16"/>
