  <head>
    <meta charset="UTF-8">

    <meta name="description" content="Erik Isidore — senior front-end engineer with 8 years building Single-Page and Server-Side Rendered applications with Vue.js/Nuxt.js and React.js/Next.js.">

    <!-- Every route renders this same page, so they all
         point here: one address for search engines to

    <meta property="og:type" content="website">

    <meta property="og:locale" content="en_US">
    <meta property="og:locale:alternate" content="pt_BR">

    <!-- Absolute, because the scraper fetching this is not
         your browser and knows nothing of relative paths -->

    <!-- Start Single Page Apps for GitHub Pages -->
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      // This script checks to see if a redirect is present
      // in the query string, converts it back into the
      // correct url and adds it to the  browser's history
      // using window.history.replaceState(...), which
      // won't cause the browser to attempt to load the
      // new url. When the single page app is loaded
      // further down in this file, the correct url will be
      // waiting in the browser's history for the single
      // page app to route accordingly.
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
    <!-- End Single Page Apps for GitHub Pages -->
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
